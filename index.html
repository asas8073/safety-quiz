<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>安全知識搶答</title>
<style>
:root {
  --red: #e21b3c;
  --blue: #1368ce;
  --yellow: #f2b705;
  --green: #26890c;
  --ink: #1b1b2f;
  --muted: #6b6b80;
  --bg1: #5b1fb3;
  --bg2: #2d0e5c;
  --card: #ffffff;
  --ok: #1f9d55;
  --bad: #d64545;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
  color: #fff;
  background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; border: 0; color: inherit; }
button:disabled { cursor: default; }
input { font: inherit; }

.c0 { background: var(--red); color: #fff; }
.c1 { background: var(--blue); color: #fff; }
.c2 { background: var(--yellow); color: #2b2100; }
.c3 { background: var(--green); color: #fff; }

.btn {
  display: inline-block; padding: .8em 1.6em; border-radius: .6em; font-weight: 700;
  background: #fff; color: var(--bg2); box-shadow: 0 .2em 0 rgba(0,0,0,.25);
  transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translateY(.15em); box-shadow: 0 .05em 0 rgba(0,0,0,.25); }
.btn.primary { background: #26890c; color: #fff; }
.btn.ghost { background: rgba(255,255,255,.16); color: #fff; box-shadow: none; }
.btn:disabled { opacity: .5; }

.pill { background: rgba(255,255,255,.18); border-radius: 999px; padding: .25em .9em; font-weight: 700; white-space: nowrap; }

@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ───────── 參加者（手機） ───────── */
.player .screen {
  min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto;
}
.player .center { justify-content: center; align-items: center; text-align: center; gap: 14px; }
.player h1 { font-size: 1.7rem; margin: 0; }
.player .sub { opacity: .85; margin: 0; }
.player .emoji { font-size: 4rem; animation: pop .4s; }
.player .field {
  width: 100%; padding: .8em 1em; border-radius: .6em; border: 3px solid transparent;
  font-size: 1.2rem; text-align: center; background: #fff; color: var(--ink);
}
.player .field:focus { outline: none; border-color: var(--yellow); }
.player .err { color: #ffd1d1; min-height: 1.4em; margin: 0; font-weight: 700; }
.player .name-big { font-size: 2rem; font-weight: 800; word-break: break-all; }

.topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: .9rem; }
.topbar .pill:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.timer { position: relative; height: 34px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; margin-bottom: 12px; }
.timer-bar { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--yellow); transition: width .25s linear; }
.timer-bar.low { background: var(--red); }
.timer-num { position: relative; text-align: center; font-weight: 800; font-size: 1.15rem; line-height: 34px; color: #2b2100; mix-blend-mode: normal; }
.qtext { background: #fff; color: var(--ink); border-radius: .7em; padding: .9em 1em; font-size: 1.12rem; font-weight: 700; margin-bottom: 12px; }
.opts { display: grid; grid-template-columns: 1fr; gap: 10px; flex: 1; align-content: start; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; min-height: 64px;
  border-radius: .7em; font-size: 1.05rem; font-weight: 700; box-shadow: 0 .2em 0 rgba(0,0,0,.28);
  transition: transform .08s, opacity .2s, box-shadow .08s;
}
.opt:active:not(:disabled) { transform: translateY(.15em); box-shadow: 0 .05em 0 rgba(0,0,0,.28); }
.opt .shape { font-size: 1.6rem; width: 1.6em; text-align: center; flex: none; }
.opt.dim { opacity: .35; }
.opt.chosen { outline: 4px solid #fff; transform: scale(1.02); }
.note { text-align: center; font-weight: 700; margin: 12px 0 0; min-height: 1.5em; }

.result { text-align: center; gap: 10px; }
.result.ok { background: linear-gradient(160deg, #1f9d55, #136b39); }
.result.bad { background: linear-gradient(160deg, #d64545, #8f2222); }
.result.none { background: linear-gradient(160deg, #6b6b80, #3f3f52); }
.result .big { font-size: 4.5rem; animation: pop .45s; }
.result h2 { margin: 0; font-size: 1.8rem; }
.result .pts { font-size: 2rem; font-weight: 800; }
.card { background: rgba(255,255,255,.16); border-radius: .8em; padding: .8em 1em; width: 100%; text-align: left; }
.card h3 { margin: 0 0 .4em; font-size: .95rem; opacity: .85; }
.board { list-style: none; margin: 0; padding: 0; }
.board li { display: flex; gap: 10px; align-items: center; padding: .3em 0; }
.board .rk { width: 2em; text-align: center; font-weight: 800; }
.board .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .sc { font-variant-numeric: tabular-nums; font-weight: 700; }
.board li.me { background: rgba(255,255,255,.22); border-radius: .5em; padding-left: .4em; padding-right: .4em; }
.ex { font-size: .95rem; text-align: left; }

#net { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); background: #fff; color: var(--bad); font-weight: 700; padding: .3em 1em; border-radius: 999px; display: none; z-index: 9; font-size: .85rem; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: var(--ink); font-weight: 700; padding: .6em 1.2em; border-radius: 999px; z-index: 9; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }

/* ───────── 主持人（投影） ───────── */
.host { font-size: clamp(14px, .9vw + 7px, 24px); }
.host .page { min-height: 100vh; padding: 1.2em 2em 1.6em; display: flex; flex-direction: column; gap: 1em; max-width: 1700px; margin: 0 auto; }
.host .head { display: flex; align-items: center; gap: 1em; justify-content: space-between; }
.host .brand { font-weight: 800; font-size: 1.15em; }
.host .url { font-size: .85em; opacity: .85; }
.host h1 { margin: 0; font-size: 2.2em; }
.host .panel { background: rgba(255,255,255,.12); border-radius: 1em; padding: 1.2em 1.4em; }
.host .panel h2 { margin: 0 0 .6em; font-size: 1.1em; }
.host input[type=password], .host input[type=number], .host select {
  padding: .55em .8em; border-radius: .5em; border: 0; font-size: 1em; color: var(--ink); background: #fff;
}
.host .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(21em, 1fr)); gap: .5em .9em; }
.host .units label { display: flex; gap: .6em; align-items: center; background: rgba(255,255,255,.1); padding: .5em .8em; border-radius: .6em; cursor: pointer; }
.host .units input { width: 1.2em; height: 1.2em; accent-color: var(--yellow); }
.host .units .cnt { margin-left: auto; opacity: .75; font-variant-numeric: tabular-nums; }
.host .form-row { display: flex; flex-wrap: wrap; gap: 1.2em 2em; align-items: center; }
.host .form-row label { display: flex; gap: .6em; align-items: center; }
.host .actions { display: flex; gap: .8em; flex-wrap: wrap; align-items: center; }
.host .actions .grow { flex: 1; }
.host .hint { opacity: .8; font-size: .9em; }
.host .err { color: #ffd1d1; font-weight: 700; min-height: 1.4em; }

.host .lobby { display: grid; grid-template-columns: minmax(18em, 26em) 1fr; gap: 2em; align-items: start; flex: 1; }
.host .qrbox { background: #fff; color: var(--ink); border-radius: 1em; padding: 1.2em; text-align: center; }
.host .qrbox .join-title { font-weight: 800; margin-bottom: .6em; }
.host .qr { display: inline-block; line-height: 0; }
.host .qr canvas, .host .qr img { max-width: 100%; height: auto; }
.host .join-url { margin-top: .6em; font-size: .8em; word-break: break-all; color: var(--muted); }
.host .count { font-size: 2.6em; font-weight: 800; }
.host .chips { display: flex; flex-wrap: wrap; gap: .5em; margin: .8em 0 1.2em; max-height: 46vh; overflow: auto; }
.host .chip { background: rgba(255,255,255,.2); padding: .35em .9em; border-radius: 999px; font-weight: 700; cursor: pointer; animation: pop .25s; }
.host .chip:hover { background: rgba(214,69,69,.7); }

.host .qhead { display: flex; align-items: center; gap: 1em; flex-wrap: wrap; }
.host .qhead .grow { flex: 1; }
.host .clock { font-size: 2.4em; font-weight: 800; min-width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--yellow); color: #2b2100; display: grid; place-items: center; }
.host .clock.low { background: var(--red); color: #fff; animation: pulse .6s infinite; }
.host .answered { font-size: 1.3em; font-weight: 800; }
.host .tbar { height: .8em; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; }
.host .tbar > div { height: 100%; width: 100%; background: var(--yellow); transition: width .25s linear; }
.host .tbar.low > div { background: var(--red); }
.host .qtext { font-size: 2em; font-weight: 800; padding: 1em 1.2em; margin: 0; text-align: center; display: grid; place-items: center; min-height: 5.5em; color: #fff; background: rgba(255,255,255,.12); border-radius: 1em; }
.host .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .8em; }
.host .tile {
  position: relative; display: flex; align-items: center; gap: .8em; padding: 1em 1.2em; min-height: 4.6em;
  border-radius: .8em; font-size: 1.45em; font-weight: 800; box-shadow: 0 .15em 0 rgba(0,0,0,.28); animation: rise .35s both;
}
.host .tile .shape { font-size: 1.5em; width: 1.3em; text-align: center; flex: none; }
.host .tile .otext { flex: 1; }
.host .tile .num { font-size: 1.1em; background: rgba(0,0,0,.28); border-radius: 999px; padding: .1em .7em; color: #fff; font-variant-numeric: tabular-nums; }
.host .tile.dim { opacity: .3; }
.host .tile.right { outline: .22em solid #fff; }
.host .tile .tick { position: absolute; right: -.4em; top: -.5em; background: #fff; color: var(--ok); width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-size: 1em; box-shadow: 0 .1em .3em rgba(0,0,0,.3); }
.host .result-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.2em; align-items: start; }
.host .ex { background: rgba(255,255,255,.14); border-radius: .8em; padding: .8em 1.1em; margin-top: .8em; font-size: 1.05em; }
.host .board li { font-size: 1.15em; padding: .4em .6em; border-radius: .5em; }
.host .board li:nth-child(odd) { background: rgba(255,255,255,.08); }

.host .podium { display: flex; justify-content: center; align-items: flex-end; gap: 1em; margin: .4em 0 1em; min-height: 12em; }
.host .pod { width: 15em; text-align: center; animation: rise .7s both; }
.host .pod .who { font-weight: 800; font-size: 1.3em; word-break: break-all; padding: 0 .3em; }
.host .pod .sc { opacity: .9; margin-bottom: .4em; font-variant-numeric: tabular-nums; }
.host .pod .step { border-radius: .8em .8em 0 0; font-size: 2em; font-weight: 800; display: grid; place-items: start center; padding-top: .2em; }
.host .pod.p1 .step { height: 5.2em; background: var(--yellow); color: #2b2100; }
.host .pod.p2 .step { height: 3.8em; background: #c8c8d8; color: #2b2b3a; }
.host .pod.p3 .step { height: 2.6em; background: #cd8b4a; color: #3a2108; }
.host .pod.p2 { animation-delay: .3s; }
.host .pod.p1 { animation-delay: .8s; }
.host .pod.p3 { animation-delay: 0s; }
.host .final-board { columns: 2; column-gap: 2em; }
.host .final-board li { break-inside: avoid; }

/* ───────── 主持台：外框、步驟列、大廳 ───────── */
.host .shell-head {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 1em;
  padding: .7em 2em; background: rgba(32, 9, 72, .88); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.host .brand-btn { background: none; font-weight: 800; font-size: 1.15em; display: flex; align-items: center; gap: .4em; padding: .2em .4em; border-radius: .5em; }
.host .brand-btn:hover { background: rgba(255,255,255,.12); }
.host .steps { display: flex; gap: .4em; margin: 0 auto; }
.host .stp { padding: .25em .9em; border-radius: 999px; background: rgba(255,255,255,.1); opacity: .7; font-weight: 700; font-size: .9em; white-space: nowrap; }
.host .stp.done { background: rgba(255,255,255,.26); opacity: 1; }
.host .stp.cur { background: var(--yellow); color: #2b2100; opacity: 1; }
.host .head-actions { display: flex; gap: .5em; align-items: center; }
.host .hbtn { background: rgba(255,255,255,.14); color: #fff; padding: .45em 1em; border-radius: .6em; font-weight: 700; font-size: .9em; white-space: nowrap; }
.host .hbtn:hover { background: rgba(255,255,255,.26); }
.host .hbtn.warn { background: rgba(214,69,69,.55); }
.host .hbtn.warn:hover { background: rgba(214,69,69,.85); }
.host .hbtn[hidden] { display: none; }
.host .main { max-width: 1700px; margin: 0 auto; padding: 1.2em 2em 7em; display: flex; flex-direction: column; gap: 1em; }

.host .hero { display: flex; align-items: center; gap: 1em; flex-wrap: wrap; }
.host .hero h1 { font-size: 2.1em; }
.host .hero .tag { opacity: .85; }
.host .lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) 24em; gap: 1.2em; align-items: start; }
.host .ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: .8em; }
.host .ucard {
  position: relative; text-align: left; padding: 1em 1em 1em 1.1em; border-radius: 1em; background: rgba(255,255,255,.1);
  border: 3px solid transparent; display: flex; flex-direction: column; gap: .2em; min-height: 7.6em;
  transition: transform .1s, background .15s, border-color .15s;
}
.host .ucard:hover { transform: translateY(-2px); background: rgba(255,255,255,.16); }
.host .ucard .em { font-size: 2em; line-height: 1.1; }
.host .ucard .un { font-weight: 800; }
.host .ucard .uname { font-size: .95em; opacity: .9; }
.host .ucard .cnt { position: absolute; right: .9em; top: .9em; font-size: .85em; opacity: .8; font-variant-numeric: tabular-nums; }
.host .ucard .chk { position: absolute; right: .7em; bottom: .6em; width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.15); font-weight: 800; color: transparent; }
.host .ucard[aria-pressed=true] { background: rgba(242,183,5,.22); border-color: var(--yellow); }
.host .ucard[aria-pressed=true] .chk { background: var(--yellow); color: #2b2100; }
.host .toolbar { display: flex; gap: .6em; flex-wrap: wrap; align-items: center; }
.host .chipbtn { background: rgba(255,255,255,.14); padding: .4em 1em; border-radius: 999px; font-weight: 700; font-size: .9em; }
.host .chipbtn:hover { background: rgba(255,255,255,.26); }
.host .side { position: sticky; top: 4.6em; display: flex; flex-direction: column; gap: 1em; }
.host .field { display: flex; flex-direction: column; gap: .4em; }
.host .field > .lbl { font-weight: 700; opacity: .9; font-size: .95em; }
.host .seg { display: flex; flex-wrap: wrap; gap: .35em; }
.host .seg button { background: rgba(255,255,255,.14); padding: .45em .9em; border-radius: .6em; font-weight: 700; min-width: 3.2em; }
.host .seg button.on { background: var(--yellow); color: #2b2100; }
.host .stepper { display: flex; align-items: center; gap: .6em; }
.host .stepper button { width: 2.2em; height: 2.2em; border-radius: 50%; background: rgba(255,255,255,.18); font-size: 1.1em; font-weight: 800; }
.host .stepper .val { min-width: 2.5em; text-align: center; font-size: 1.5em; font-weight: 800; font-variant-numeric: tabular-nums; }
.host .sw { display: flex; align-items: center; gap: .6em; cursor: pointer; background: none; text-align: left; }
.host .sw .track { width: 2.8em; height: 1.5em; border-radius: 999px; background: rgba(255,255,255,.25); position: relative; transition: background .15s; flex: none; }
.host .sw .track::after { content: ''; position: absolute; left: .17em; top: .17em; width: 1.16em; height: 1.16em; border-radius: 50%; background: #fff; transition: transform .15s; }
.host .sw[aria-pressed=true] .track { background: var(--green); }
.host .sw[aria-pressed=true] .track::after { transform: translateX(1.3em); }

.host .bottombar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 1em; justify-content: center;
  padding: .8em 2em; background: rgba(32, 9, 72, .92); backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,.12);
}
.host .bottombar { flex-wrap: wrap; }
.host .bottombar .btn { white-space: nowrap; }
.host .bottombar .sum { font-size: 1.1em; font-weight: 700; }
.host .bottombar .sum small { opacity: .8; font-weight: 400; }
.host .bigbtn { font-size: 1.25em; padding: .7em 2em; }
.host .linkrow { display: flex; gap: 1em; flex-wrap: wrap; font-size: .95em; }

.host .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10, 0, 30, .65); display: grid; place-items: center; padding: 1em; animation: pop .15s; }
.host .dialog { background: #fff; color: var(--ink); border-radius: 1.1em; padding: 1.4em 1.6em; max-width: 46em; width: 100%; max-height: 86vh; overflow: auto; }
.host .dialog h2 { margin: 0 0 .6em; font-size: 1.3em; }
.host .dialog ol { margin: 0 0 1em 1.2em; padding: 0; line-height: 1.7; }
.host .dialog .actions { display: flex; gap: .6em; justify-content: flex-end; flex-wrap: wrap; margin-top: 1em; }
.host .dialog .btn { box-shadow: none; background: #eceaf4; color: var(--ink); }
.host .dialog .btn.primary { background: var(--green); color: #fff; }
.host .dialog .btn.danger { background: var(--bad); color: #fff; }
.host .hist { width: 100%; border-collapse: collapse; }
.host .hist th, .host .hist td { text-align: left; padding: .45em .5em; border-bottom: 1px solid #e5e3ee; vertical-align: top; }
.host .hist th { font-size: .85em; color: var(--muted); }
.host .empty { color: var(--muted); padding: 1em 0; }

@media (max-width: 900px) {
  .host .lobby-grid { grid-template-columns: 1fr; }
  .host .side { position: static; }
  .host .shell-head { flex-wrap: wrap; padding: .6em 1em; }
  .host .steps { order: 3; width: 100%; justify-content: center; }
  .host .main { padding: 1em 1em 9em; }
  .host .bigbtn { font-size: 1.05em; padding: .6em 1.2em; }
}

.host .warnbar { background: #b3261e; color: #fff; padding: .5em 2em; font-weight: 700; font-size: .95em; }
.host .warnbar[hidden] { display: none; }
.host .tblwrap { overflow-x: auto; }
.host .stbl { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.host .stbl th, .host .stbl td { padding: .4em .7em; text-align: center; white-space: nowrap; }
.host .stbl th { font-size: .9em; opacity: .85; border-bottom: 1px solid rgba(255,255,255,.25); }
.host .stbl td.nm { text-align: left; font-weight: 700; }
.host .stbl td.tot { font-weight: 800; color: var(--yellow); }
.host .stbl td.full { color: #8df08d; font-weight: 800; }
.host .stbl tbody tr:nth-child(odd) { background: rgba(255,255,255,.07); }
.player .unitline { font-weight: 700; margin-top: .4em; }
.player .utable { width: 100%; border-collapse: collapse; font-size: .95rem; }
.player .utable td { padding: .3em 0; }
.player .utable td:last-child { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.player .utable tr.full td:last-child { color: #8df08d; }

.host .tip { margin-top: 1em; background: rgba(255,255,255,.12); border-radius: .9em; padding: .8em 1em; font-size: .9em; }
.host .tip ol { margin: .4em 0 .5em 1.2em; padding: 0; line-height: 1.6; }
</style>

</head>
<body class="player">
<div id="net">連線不穩，重試中…</div>
<div id="app"></div>
<div id="toast"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyLL63PO-H8spk80cQ6M23Vfk0LKpRYSJUkk9ngwqcluJnXKJXEfqhxX972woWWOk6nMw/exec';
/* 共用小工具：呼叫後端、建立 DOM、本機儲存 */
var SHAPES = ['▲', '◆', '●', '■'];
var LETTERS = ['A', 'B', 'C', 'D'];

function rpc(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit', redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.err || '連線失敗'); return j.r; });
}

/** 建立元素。文字一律用 textContent / 文字節點，不會被當成 HTML。 */
function h(tag, props) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) {
    var kids = arguments[i];
    if (!Array.isArray(kids)) kids = [kids];
    kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      e.append(c);
    });
  }
  return e;
}

var store = (function () {
  var mem = {};
  return {
    get: function (k) { try { var v = localStorage.getItem('quiz_' + k); return v === null ? (mem[k] || '') : v; } catch (e) { return mem[k] || ''; } },
    set: function (k, v) { mem[k] = v; try { localStorage.setItem('quiz_' + k, v); } catch (e) {} }
  };
})();

function fmt(n) { return Number(n || 0).toLocaleString('en-US'); }

function errMsg(e) {
  var m = (e && e.message) ? String(e.message) : String(e || '');
  return m.replace(/^Error:\s*/, '');
}
</script>

<script>
(function () {
  var app = document.getElementById('app');
  var S = { pid: store.get('pid'), name: store.get('name'), offset: 0, key: '', local: null, pollT: 0, tickT: 0, d: null, timedOut: false, joining: false };

  /* ── 小工具 ── */
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function setView(key, build) {
    if (S.key === key) return false;
    S.key = key;
    app.replaceChildren(build());
    return true;
  }
  function screen(emoji, title, sub) {
    return h('div', { class: 'screen center' },
      h('div', { class: 'emoji' }, emoji), h('h1', null, title), sub ? h('p', { class: 'sub' }, sub) : null);
  }
  function leftMs(d) { return d.qStart + d.dur * 1000 - (Date.now() + S.offset); }
  function boardList(top, myName) {
    return h('ol', { class: 'board' }, top.map(function (t, i) {
      var medal = ['🥇', '🥈', '🥉'][i] || String(i + 1);
      return h('li', { class: t[0] === myName ? 'me' : '' },
        h('span', { class: 'rk' }, medal), h('span', { class: 'nm' }, t[0]), h('span', { class: 'sc' }, fmt(t[1])));
    }));
  }

  /* ── 離開（換暱稱或不玩了） ── */
  function leave() {
    var pid = S.pid;
    S.pid = ''; store.set('pid', '');
    S.key = '';
    rpc('rpcLeave', pid).catch(function () {}).then(function () { poll(); });
  }

  /* ── 各畫面 ── */
  function joinView(d) {
    setView('join:' + d.gid, function () {
      var input = h('input', { class: 'field', maxlength: '12', placeholder: '輸入你的姓名（成績會記在這個名字上）', value: S.name || '', autocomplete: 'off', enterkeyhint: 'go' });
      var err = h('p', { class: 'err' });
      var btn = h('button', { class: 'btn primary', style: 'width:100%;font-size:1.2rem' }, '加入遊戲');
      function go() {
        if (S.joining) return;
        var name = input.value.trim();
        if (!name) { err.textContent = '請輸入暱稱'; return; }
        S.joining = true; btn.disabled = true; err.textContent = '';
        rpc('rpcJoin', name, S.pid).then(function (r) {
          S.joining = false; btn.disabled = false;
          if (!r.ok) { err.textContent = r.msg || '加入失敗'; return; }
          S.pid = r.pid; S.name = r.name; store.set('pid', r.pid); store.set('name', r.name);
          S.key = ''; poll();
        }).catch(function (e) { S.joining = false; btn.disabled = false; err.textContent = errMsg(e) || '連線失敗，請再試一次'; });
      }
      btn.addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      return h('div', { class: 'screen center' },
        h('div', { class: 'emoji' }, '🛡️'), h('h1', null, '安全知識搶答'),
        h('p', { class: 'sub' }, '請輸入真實姓名或座號，老師會用它登記成績'), input, btn, err);
    });
  }

  function lobbyView(d) {
    setView('lobby:' + d.gid, function () {
      return h('div', { class: 'screen center' },
        h('div', { class: 'emoji' }, '🎉'), h('h1', null, '你已加入！'),
        h('div', { class: 'name-big' }, d.me.n), h('p', { class: 'sub' }, '請看大螢幕，等主持人開始…'),
        h('button', { class: 'btn ghost', style: 'margin-top:12px', onclick: leave }, '不是我？換暱稱'));
    });
  }

  function questionView(d) {
    var chosen = d.me.a >= 0 ? d.me.a : (S.local && S.local.gid === d.gid && S.local.qi === d.qi ? S.local.c : -1);
    var changed = setView('q:' + d.gid + ':' + d.qi, function () {
      S.timedOut = false;
      var btns = d.q.o.map(function (txt, i) {
        return h('button', { class: 'opt c' + i, onclick: function () { choose(d, i); } },
          h('span', { class: 'shape' }, SHAPES[i]), h('span', null, txt));
      });
      return h('div', { class: 'screen' },
        h('div', { class: 'topbar' },
          h('span', { class: 'pill' }, '第 ' + (d.qi + 1) + ' / ' + d.total + ' 題'),
          h('span', { class: 'pill' }, d.q.u),
          h('span', { class: 'pill', id: 'myscore' }, fmt(d.me.s) + ' 分')),
        h('div', { class: 'timer' }, h('div', { class: 'timer-bar', id: 'tbar' }), h('div', { class: 'timer-num', id: 'tnum' }, '')),
        h('div', { class: 'qtext' }, d.q.t),
        h('div', { class: 'opts', id: 'opts' }, btns),
        h('p', { class: 'note', id: 'note' }, ''));
    });
    if (changed || chosen >= 0) markChosen(chosen);
    startTimer();
  }

  function markChosen(c) {
    var btns = document.querySelectorAll('#opts .opt');
    if (c < 0) return;
    btns.forEach(function (b, i) {
      b.disabled = true;
      b.classList.toggle('chosen', i === c);
      b.classList.toggle('dim', i !== c);
    });
    var note = document.getElementById('note');
    if (note) note.textContent = '✅ 已送出！等待公布答案…';
  }

  function choose(d, i) {
    if (S.local && S.local.gid === d.gid && S.local.qi === d.qi) return;
    S.local = { gid: d.gid, qi: d.qi, c: i };
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    markChosen(i);
    var tries = 0;
    (function send() {
      rpc('rpcAnswer', S.pid, d.qi, i).then(function (r) {
        if (!r.ok) {
          if (r.err === 'closed') toast('時間到，這題沒有算分');
          else if (r.err === 'notfound') { S.me = null; poll(); }
        }
      }).catch(function () {
        if (tries++ < 2) setTimeout(send, 800); else toast('網路不穩，這題可能沒送出');
      });
    })();
  }

  function startTimer() {
    clearInterval(S.tickT);
    var d = S.d;
    function tick() {
      var left = leftMs(d), sec = Math.max(0, Math.ceil(left / 1000));
      var num = document.getElementById('tnum'), bar = document.getElementById('tbar');
      if (!num) return;
      num.textContent = sec;
      bar.style.width = Math.max(0, Math.min(100, left / (d.dur * 10))) + '%';
      bar.classList.toggle('low', left < 5000);
      if (left <= 0 && !S.timedOut) {
        S.timedOut = true;
        var opts = document.querySelectorAll('#opts .opt');
        opts.forEach(function (b) { b.disabled = true; });
        var note = document.getElementById('note');
        if (note && !note.textContent) note.textContent = '⏱ 時間到！等待公布答案…';
        clearTimeout(S.pollT); S.pollT = setTimeout(poll, 500);
      }
    }
    tick();
    S.tickT = setInterval(tick, 200);
  }

  function resultView(d) {
    setView('r:' + d.gid + ':' + d.qi, function () {
      var me = d.me, none = me.a < 0, ok = me.ok;
      var cls = none ? 'none' : (ok ? 'ok' : 'bad');
      var head = none ? ['⏱', '這題沒有作答'] : (ok ? ['🎉', '答對了！'] : ['😅', '答錯了']);
      var rows = [
        h('div', { class: 'big' }, head[0]), h('h2', null, head[1]),
        ok ? h('div', { class: 'pts' }, '+' + fmt(me.pts)) : null,
        me.k >= 2 ? h('div', { class: 'pill' }, '🔥 連對 ' + me.k + ' 題') : null,
        h('div', { class: 'card' },
          h('h3', null, '正確答案'),
          h('div', { style: 'font-weight:800' }, LETTERS[d.q.a] + '. ' + d.q.o[d.q.a]),
          (!ok && !none) ? h('div', { style: 'opacity:.85;margin-top:.3em' }, '你選的是 ' + LETTERS[me.a] + '. ' + d.q.o[me.a]) : null,
          d.q.ex ? h('div', { class: 'ex', style: 'margin-top:.5em' }, d.q.ex) : null),
        me.unit ? h('div', { class: 'card' }, h('h3', null, '本單元成績'),
          h('div', { class: 'unitline' }, me.unit.name),
          h('div', null, '答對 ' + me.unit.c + ' / ' + me.unit.n + ' 題　·　目前 ' + me.unit.s + ' 分（滿分 ' + me.unit.max * 10 + '）')) : null,
        h('div', { class: 'card' },
          h('h3', null, '目前第 ' + (me.rank || '-') + ' 名　·　' + fmt(me.s) + ' 分'),
          d.top ? boardList(d.top, d.me.n) : null),
        h('p', { class: 'sub' }, d.qi + 1 >= d.total ? '等待主持人公布最終成績…' : '等待下一題…')
      ];
      return h('div', { class: 'screen result ' + cls }, rows);
    });
  }

  function finalView(d) {
    setView('f:' + d.gid, function () {
      var me = d.me, medal = ['🥇', '🥈', '🥉'][me.rank - 1] || '🏁';
      return h('div', { class: 'screen center' },
        h('div', { class: 'emoji' }, medal),
        h('h1', null, '第 ' + me.rank + ' 名'),
        h('div', { class: 'name-big' }, me.n),
        h('div', { class: 'pill', style: 'font-size:1.2rem' }, fmt(me.s) + ' 分　·　答對 ' + me.c + ' / ' + d.total + ' 題'),
        me.units ? h('div', { class: 'card' }, h('h3', null, '各單元成績（答對一題 10 分）'),
          h('table', { class: 'utable' }, me.units.map(function (u) {
            return h('tr', { class: u.s >= u.max * 10 ? 'full' : '' }, h('td', null, '單元' + u.u + ' ' + u.name), h('td', null, u.s + ' / ' + u.max * 10));
          })),
          h('div', { class: 'unitline' }, '合計 ' + me.official + ' 分')) : null,
        h('div', { class: 'card' }, h('h3', null, '前 10 名'), d.top ? boardList(d.top, me.n) : null),
        h('p', { class: 'sub' }, '謝謝你的參與，記得把今天學到的帶回生活！'),
        h('button', { class: 'btn ghost', onclick: leave }, '離開'));
    });
  }

  /* ── 主流程 ── */
  function render(d) {
    S.d = d;
    clearInterval(S.tickT);
    if (d.phase === 'idle') return setView('idle', function () { return screen('⏳', '等待遊戲開始', '主持人準備好之後會自動開始，請稍候。'); });
    if (!d.me) {
      if (d.phase === 'final') return setView('over', function () { return screen('🏁', '這場遊戲已結束', '謝謝你的參與！'); });
      return joinView(d);
    }
    if (d.phase === 'lobby') return lobbyView(d);
    if (d.phase === 'question') return questionView(d);
    if (d.phase === 'result') return resultView(d);
    if (d.phase === 'final') return finalView(d);
  }

  function schedule(failed) {
    var d = S.d, ms = 2000;
    if (failed) ms = 3000;
    else if (d) {
      if (d.phase === 'question') { var left = leftMs(d); ms = left > 3500 ? 3000 : Math.max(400, left + 400); }
      else if (d.phase === 'final') ms = 6000;
      else if (d.phase === 'idle') ms = 3000;
    }
    clearTimeout(S.pollT);
    S.pollT = setTimeout(poll, ms + Math.random() * 500);
  }

  var net = document.getElementById('net');
  function poll() {
    clearTimeout(S.pollT);
    rpc('rpcPoll', S.pid).then(function (d) {
      net.style.display = 'none';
      S.offset = d.now - Date.now();
      render(d);
      schedule(false);
    }).catch(function () {
      net.style.display = 'block';
      schedule(true);
    });
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  poll();
})();
</script>
</body>
</html>
